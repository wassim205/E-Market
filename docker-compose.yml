services:

# Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: mern-api-image
    container_name: emarket_backend
    ports:
      - '8000:8000'
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

# Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: mern-frontend-image
    container_name: emarket_frontend
    ports:
      - '5173:5173'
    # depends_on:
    #   - mongo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - '8081:8081'
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:latest
    container_name: mongo_container
    ports:
      - '27018:27017'
    volumes:
      - mongotestdata:/data/db
    networks:
      - app-network
    environment:
      DB_URI: mongodb://mongo:27017/emarket_db
    restart: always

  redis:
    image: redis:7
    container_name: redis_container
    ports:
      - '6378:6379'
    networks:
      - app-network

volumes:
  mongotestdata:

networks:
  app-network:
